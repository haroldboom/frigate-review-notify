alias: Camera notifications - doorbell
description: Person at the door while it is closed, animated preview, live-stream button
use_blueprint:
  path: haroldboom/frigate_review_notify.yaml
  input:
    cameras:
      - camera.doorbell
    notify_action: notify.all_phones
    base_url: https://ha.example.org
    labels:
      - person
    state_entity: binary_sensor.front_door
    state_values:
      - 'off'
    image: '{{base_url}}/api/frigate{{client_id}}/notifications/{{review_id}}/review_preview.gif'
    update_image: ''
    clip_url: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/{{camera}}/master.m3u8'
